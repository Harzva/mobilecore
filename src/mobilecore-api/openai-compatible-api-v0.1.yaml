openapi: 3.0.3
info:
  title: MobileCore Local OpenAI-Compatible API
  version: 0.1.4-rc1
  description: |
    Loopback-only API for MobileCode and other local clients. The llama.cpp/libmtmd
    Qwen2.5-Omni route supports text, image, and audio input with text output only.
    Video input and audio output are not implemented.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Read runtime, modality, artifact, and resource capabilities
      responses:
        '200':
          description: Capability snapshot; booleans report the currently loaded runtime, not model-card claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/models:
    get:
      summary: List local main-model artifacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Model list; mmproj files are not returned as standalone language models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
  /v1/chat/completions:
    post:
      summary: Create a text or single-attachment multimodal chat completion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion or SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Typed request, modality, media, artifact, or runtime failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /metrics:
    get:
      summary: Read aggregate request and latest decode metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Redacted local runtime metrics; prompts and media are never included
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_model: {type: string, nullable: true}
                  backend: {type: string}
                  uptime_seconds: {type: integer, format: int64}
                  requests_total: {type: integer, format: int64}
                  requests_failed: {type: integer, format: int64}
                  last_decode_tokens_per_second: {type: number}
                  average_decode_tokens_per_second: {type: number}
                  last_first_token_ms: {type: integer}
                  last_total_ms: {type: integer}
                  memory_peak_mb: {type: integer}
  /v1/recommendations:
    get:
      summary: Recommend installed models for the current device
      description: Responses contain public model IDs and never contain absolute model paths.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: preference
          schema:
            type: string
            enum: [speed, stability, small]
      responses:
        '200':
          description: Device profile, scoring snapshot, and ranked installed models
  /mobilecore/model/load:
    post:
      summary: Load an installed GGUF by public model ID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id: {type: string}
                context_length: {type: integer, minimum: 128, maximum: 32768, default: 4096}
                threads: {type: integer, minimum: 1, maximum: 16, default: 4}
      responses:
        '200':
          description: Installed model loaded
        '400':
          description: Model ID is unavailable or the model failed to load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mobilecore/model/unload:
    post:
      summary: Unload the active model without deleting its artifact
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Runtime resources released
  /mobilecore/omni/status:
    get:
      summary: Read the pinned GGUF plus mmproj install state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Install and verification snapshot without rehashing artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniInstallStatus'
  /mobilecore/omni/install:
    post:
      summary: Start a consent-gated app-private artifact installation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmniInstallRequest'
      responses:
        '202':
          description: Preflight passed and the asynchronous install was accepted
        '400':
          description: Typed consent, license, Wi-Fi, memory, storage, or install failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mobilecore/omni/cancel:
    post:
      summary: Request cancellation of an active artifact installation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancellation requested
  /mobilecore/omni/verify:
    post:
      summary: Fully rehash and verify both installed artifacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified pair snapshot
        '400':
          description: Artifact missing or checksum mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mobilecore/omni/load:
    post:
      summary: Load a previously verified main GGUF and mmproj pair
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context_length:
                  type: integer
                  minimum: 128
                  maximum: 32768
                  default: 4096
                threads:
                  type: integer
                  minimum: 1
                  maximum: 16
                  default: 4
      responses:
        '200':
          description: Both artifacts loaded
        '400':
          description: Pair is unavailable, unverified, or failed to load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mobilecore/omni/uninstall:
    post:
      summary: Unload and remove the exact app-private artifact pair
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pair and verification metadata removed
    delete:
      summary: Unload and remove the exact app-private artifact pair
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pair and verification metadata removed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Model:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
        owned_by:
          type: string
          example: mobilecore
        mobilecore:
          type: object
          properties:
            format:
              type: string
              example: gguf
            backend:
              type: string
              example: llama.cpp
            quantization:
              type: string
              example: Q4_K_M
            context_length:
              type: integer
              example: 4096
            loaded:
              type: boolean
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              maxItems: 32
              items:
                oneOf:
                  - $ref: '#/components/schemas/TextContentPart'
                  - $ref: '#/components/schemas/ImageContentPart'
                  - $ref: '#/components/schemas/AudioContentPart'
    TextContentPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text, input_text]
        text:
          type: string
    ImageContentPart:
      type: object
      required: [type, image_url]
      properties:
        type:
          type: string
          enum: [image_url, input_image]
        image_url:
          oneOf:
            - type: string
              description: Data URI or app-controlled local URI; remote HTTP(S) is rejected
            - type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: Data URI or app-controlled local URI; remote HTTP(S) is rejected
    AudioContentPart:
      type: object
      required: [type, input_audio]
      properties:
        type:
          type: string
          enum: [input_audio]
        input_audio:
          type: object
          required: [data, format]
          properties:
            data:
              type: string
              description: Base64, data URI, or app-controlled local URI
            format:
              type: string
              enum: [wav, mp3, flac, ogg, m4a, mp4, aac]
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          maxItems: 128
          description: At most one image or audio attachment is accepted per request
          items:
            $ref: '#/components/schemas/ChatMessage'
        modalities:
          type: array
          description: The GGUF route supports text output only
          items:
            type: string
            enum: [text]
        temperature:
          type: number
          default: 0.7
        max_tokens:
          type: integer
          default: 512
        stream:
          type: boolean
          default: false
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    ModalityCapabilities:
      type: object
      required: [text_input, image_input, audio_input, video_input, text_output, audio_output]
      properties:
        text_input: {type: boolean}
        image_input: {type: boolean}
        audio_input: {type: boolean}
        video_input: {type: boolean, example: false}
        text_output: {type: boolean}
        audio_output: {type: boolean, example: false}
    ArtifactHealth:
      type: object
      required: [file_name, digest_algorithm, digest, expected_bytes, present, verified]
      properties:
        file_name: {type: string}
        digest_algorithm: {type: string, enum: [sha256], nullable: true}
        digest: {type: string, nullable: true}
        expected_bytes: {type: integer, format: int64}
        present: {type: boolean}
        verified: {type: boolean}
    HealthResponse:
      type: object
      required: [status, service, version, model_loaded, quantization, runtime, backend, capabilities, artifacts, preflight]
      properties:
        status: {type: string, example: ok}
        service: {type: string, example: mobilecore}
        version: {type: string}
        model_loaded: {type: boolean}
        active_model: {type: string, nullable: true}
        quantization: {type: string}
        runtime: {type: string, example: llama.cpp/libmtmd}
        backend: {type: string, example: cpu}
        llama_cpp_revision: {type: string}
        capabilities:
          $ref: '#/components/schemas/ModalityCapabilities'
        artifacts:
          type: object
          properties:
            main: {$ref: '#/components/schemas/ArtifactHealth'}
            mmproj: {$ref: '#/components/schemas/ArtifactHealth'}
        preflight:
          type: object
          properties:
            memory: {type: object}
            storage: {type: object}
            ok: {type: boolean}
            failure_code: {type: string, nullable: true}
    OmniInstallRequest:
      type: object
      required: [explicit_consent, accepted_license_id]
      properties:
        explicit_consent: {type: boolean}
        accepted_license_id: {type: string, example: qwen-research}
        wifi_only: {type: boolean, default: true}
    OmniInstallStatus:
      type: object
      properties:
        model_id: {type: string}
        revision: {type: string}
        phase: {type: string}
        pair_verified: {type: boolean}
        artifacts: {type: object}
        preflight: {type: object}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: {type: string}
            type: {type: string}
            code:
              type: string
              enum:
                - invalid_request
                - unsupported_modality
                - artifact_missing
                - checksum_mismatch
                - insufficient_memory
                - insufficient_storage
                - model_load_failed
                - media_too_large
                - cancelled
                - remote_media_not_allowed
                - local_media_not_allowed
                - unsupported_media_type
                - invalid_media
                - explicit_consent_required
                - license_acceptance_required
                - wifi_required
                - manifest_invalid
                - download_failed
                - install_in_progress
